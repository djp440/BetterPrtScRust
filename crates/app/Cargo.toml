[package]
name = "bps-app"
description = "BetterPrtSc 常驻实例（BetterPrtSc.exe）与 bps CLI（bps.exe）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "BetterPrtSc"
path = "src/main.rs"

# 控制台程序；把命令经命名管道转交给常驻实例。
[[bin]]
name = "bps"
path = "src/bps.rs"

[dependencies]
bps-core.workspace = true
bps-platform.workspace = true

[target.'cfg(windows)'.dependencies]
bps-platform-windows.workspace = true
# 设置界面等独立窗口（egui），只在 `--settings` 等界面子进程里初始化。
bps-ui.workspace = true

# 只给忽略的真机测试（tests/overlay_latency.rs、tests/annotation_smoke.rs、
# tests/overlay_aids_smoke.rs）用。
[target.'cfg(windows)'.dev-dependencies]
bps-platform-fake.workspace = true
png.workspace = true

[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

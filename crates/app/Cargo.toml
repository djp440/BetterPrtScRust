[package]
name = "bps-app"
description = "BetterPrtSc 常驻实例（BetterPrtSc.exe）与 bps CLI（bps.exe）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "BetterPrtSc"
path = "src/main.rs"

# 控制台程序；把命令经命名管道转交给常驻实例。
[[bin]]
name = "bps"
path = "src/bps.rs"

[dependencies]
bps-core.workspace = true
bps-platform.workspace = true

[target.'cfg(windows)'.dependencies]
bps-platform-windows.workspace = true
# 设置界面等独立窗口（egui），只在 `--settings` 等界面子进程里初始化。
bps-ui.workspace = true

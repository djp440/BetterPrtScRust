[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/platform-fake",
    "crates/platform-windows",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# 依赖版本统一在此声明；成员 crate 用 `xxx.workspace = true` 引用。
# 轻量指标是硬约束：新增依赖尽量 default-features = false，只开需要的 feature。
[workspace.dependencies]
bps-core = { path = "crates/core" }
bps-platform = { path = "crates/platform" }
bps-platform-fake = { path = "crates/platform-fake" }
bps-platform-windows = { path = "crates/platform-windows" }

png = { version = "0.18", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
windows = { version = "0.62", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

# debug 构建也优化第三方依赖：未优化的 PNG 编码处理一张 4K 截图要数秒。
[profile.dev.package."*"]
opt-level = 3
